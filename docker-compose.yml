# =============================================================================
# docker-compose.yml — HOST MACHINE (Operator's Ubuntu 22.04 laptop/desktop)
#
# Usage:
#   docker compose up          # start teleoperation
#   docker compose up --build  # rebuild image first
#   docker compose down        # stop all containers
#
# Prerequisites:
#   1. Run ./scripts/gen_certs.sh to create SSL certificates
#   2. Copy .env.example to .env and fill in your values
#   3. Ensure the Host is networked to the robot (192.168.123.x subnet)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # HOST SERVICE — main teleoperation process
  #
  # Responsibilities:
  #   - Runs the Vuer WebXR server (port 8012) that the Quest 3 connects to
  #   - Receives hand/wrist pose data from Quest 3 over WebSocket
  #   - Solves IK for G1's 14 arm joints (7 per arm) using pinocchio + CasADi
  #   - Retargets 21 Quest 3 hand keypoints → 7 Dex3-1 finger joint angles
  #   - Sends joint commands to the robot over CycloneDDS (unitree_sdk2_python)
  #   - Receives camera frames from the image-client sidecar via ZMQ
  #   - Optionally records episodes for imitation learning datasets
  # ---------------------------------------------------------------------------
  host:
    build:
      context: ./docker/host
      dockerfile: Dockerfile
    image: g1_xr_teleop/host:latest
    container_name: g1_teleop_host

    # Run interactively so r/s/q keypresses work in the terminal
    stdin_open: true
    tty: true

    # Network: use host networking so DDS multicast reaches the robot directly
    # (CycloneDDS requires raw multicast packets on the physical interface)
    network_mode: host

    environment:
      # -----------------------------------------------------------------------
      # Robot configuration — MUST match your hardware
      # -----------------------------------------------------------------------
      ARM: ${ARM:-G1_29}              # G1 29DoF arm controller
      EE: ${EE:-dex3}                 # Dex3-1 dexterous hand end-effector
      IMG_SERVER_IP: ${IMG_SERVER_IP:-192.168.123.164}  # Robot PC2 address

      # -----------------------------------------------------------------------
      # Teleop behaviour
      # -----------------------------------------------------------------------
      INPUT_MODE: ${INPUT_MODE:-hand}           # 'hand' = Quest 3 hand tracking
      DISPLAY_MODE: ${DISPLAY_MODE:-immersive}  # 'immersive' | 'ego' | 'pass-through'
      FREQUENCY: ${FREQUENCY:-30.0}             # Control loop Hz

      # -----------------------------------------------------------------------
      # Optional mode flags (set to "true" to enable)
      # -----------------------------------------------------------------------
      AUTO_START: ${AUTO_START:-true}    # Skip [r] key — start tracking as soon as container is ready
      MOTION: ${MOTION:-false}        # Arm + locomotion (requires waist motor)
      HEADLESS: ${HEADLESS:-false}    # No display (e.g. running on PC2 itself)
      SIM: ${SIM:-false}              # Isaac Lab simulation mode
      RECORD: ${RECORD:-false}        # Enable episode recording

      # -----------------------------------------------------------------------
      # Recording metadata (only used when RECORD=true)
      # -----------------------------------------------------------------------
      TASK_NAME: "${TASK_NAME:-pick_cube}"
      TASK_GOAL: "${TASK_GOAL:-Pick up the red cube.}"
      TASK_DESC: "${TASK_DESC:-Pick and place task}"
      TASK_STEPS: "${TASK_STEPS:-step1: approach; step2: grasp; step3: lift;}"

      # Network interface for CycloneDDS (leave blank for auto-detect)
      # Set to your Ethernet interface name, e.g. eth0, enp3s0
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-}
      CYCLONEDDS_URI: "<CycloneDDS><Domain><General><Interfaces><NetworkInterface name='${NETWORK_INTERFACE:-eno2}'/></Interfaces></General></Domain></CycloneDDS>"

      # SSL cert paths (these files come from the certs/ volume below)
      XR_TELEOP_CERT: /certs/cert.pem
      XR_TELEOP_KEY: /certs/key.pem

    volumes:
      # SSL certificates (generated by scripts/gen_certs.sh)
      - ./certs:/certs:ro

      # Recorded episode data — persisted outside the container
      - ./data:/opt/xr_teleoperate/teleop/utils/data

      # Patched televuer.py — fixes silent HAND_MOVE failure when only one hand
      # is visible (upstream uses ["left"]/["right"] which throws KeyError).
      - ./docker/host/televuer_patch.py:/opt/xr_teleoperate/teleop/televuer/src/televuer/televuer.py:ro

      # Patched robot_hand_unitree.py — replaces infinite DDS wait with a
      # 10-second timeout so arm teleop works even when the Dex3-1 hand
      # service is not running on the robot.
      - ./docker/host/robot_hand_unitree_patch.py:/opt/xr_teleoperate/teleop/robot_control/robot_hand_unitree.py:ro

      # Patched teleop_hand_and_arm.py — adds --auto-start flag support.
      - ./docker/host/teleop_hand_and_arm_patch.py:/opt/xr_teleoperate/teleop/teleop_hand_and_arm.py:ro

      # Entrypoint script with custom command support
      - ./docker/host/entrypoint.sh:/entrypoint.sh:ro

      # Optional: mount local xr_teleoperate checkout for live code editing
      # Uncomment to develop without rebuilding the image on every change.
      - ./xr_teleoperate:/opt/xr_teleoperate

    ports:
      # Vuer WebXR server — Quest 3 connects to this via its browser
      # URL: https://<HOST_IP>:8012/?ws=wss://<HOST_IP>:8012
      - "8012:8012"

    # Privileged required for CycloneDDS to access raw network interfaces
    # and for USB passthrough if cameras are connected to the Host directly.
    privileged: true

    restart: on-failure

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # VISUALIZATION SERVICES — Real-time RViz2 monitoring of the G1 robot
  #
  # Three services work together:
  #   1. g1_joint_relay  — subscribes to DDS LowState → /joint_states @ 30Hz
  #   2. g1_robot_state  — URDF + /joint_states → /tf transforms for RViz
  #   3. g1_rviz         — RViz2 window showing live robot model
  #
  # Prerequisites (run once on the Host before docker compose up):
  #   xhost +local:docker
  # ---------------------------------------------------------------------------

  # ── 1. DDS → ROS2 Joint State Relay ────────────────────────────────────────
  # Reads live LowState from the robot's DDS network and publishes /joint_states
  g1_joint_relay:
    build:
      context: ./docker/viz
      dockerfile: Dockerfile.viz
    image: g1_xr_teleop/viz:latest
    container_name: g1_teleop_joint_relay
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - NETWORK_INTERFACE=${NETWORK_INTERFACE:-}
      - SIM=${SIM:-false}
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name='${NETWORK_INTERFACE:-eno2}'/></Interfaces></General></Domain></CycloneDDS>
    command: >
      python3 /workspace/dds_joint_relay.py
      ${NETWORK_INTERFACE:+--interface ${NETWORK_INTERFACE}}
      ${SIM:+--domain 1}
    restart: unless-stopped
    depends_on:
      - host

  # ── 2. Robot State Publisher (URDF → /tf) ──────────────────────────────────
  # Reads the G1 URDF and /joint_states to publish coordinate transforms
  # that RViz needs to correctly position each link in 3D space
  g1_robot_state:
    image: g1_xr_teleop/viz:latest
    container_name: g1_teleop_robot_state
    network_mode: host
    ipc: host
    environment:
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name='${NETWORK_INTERFACE:-eno2}'/></Interfaces></General></Domain></CycloneDDS>
    volumes:
      # Mount the local xr_teleoperate checkout so we can read the G1 URDF
      - ./xr_teleoperate:/opt/xr_teleoperate:ro
    command: ["/workspace/start_robot_state.sh"]
    restart: unless-stopped
    depends_on:
      - g1_joint_relay

  # ── 3. RViz2 ────────────────────────────────────────────────────────────────
  # Opens the RViz window showing the live G1 robot model
  # Run `xhost +local:docker` on the Host before starting
  g1_rviz:
    image: g1_xr_teleop/viz:latest
    container_name: g1_teleop_rviz
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY:-}
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name='${NETWORK_INTERFACE:-eno2}'/></Interfaces></General></Domain></CycloneDDS>
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./xr_teleoperate:/opt/xr_teleoperate:ro
    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
        rviz2 -d /workspace/g1_viz.rviz
      "
    restart: unless-stopped
    depends_on:
      - g1_joint_relay
      - g1_robot_state

